<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        function redirectToNewUrl() {
            const currentUrl = window.location.href;
            const newBaseUrl = "https://surfacesyntacticud.org";
            const subpage = currentUrl.substring(currentUrl.indexOf(window.location.origin) + window.location.origin.length);
            const newUrl = newBaseUrl + subpage;
            window.location.href = newUrl;
        }
        setTimeout(redirectToNewUrl, 0);
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>You will be redirected to a new page shortly. If you are not redirected, <a href="#" onclick="redirectToNewUrl()">click here</a>.</p>
</body>
</html>
